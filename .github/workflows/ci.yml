name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # package-lock.json npm 11 ile üretildi; Node 22'nin gömülü npm'i ile uyuşmuyor
      - run: npm install -g npm@11
      # Electron ikilisini indirmeye gerek yok; yalnızca testler ve sözdizimi denetimi
      - run: npm ci --ignore-scripts
      - run: node --check main.js && node --check preload.js && node --check renderer.js && node --check lib.js
      - run: npm test
